<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Project Crystal</title><style>
body{margin:0;background:#101624;color:#f2f1df;font:15px system-ui}main{max-width:850px;margin:auto;padding:12px}h1{font-size:24px;margin:8px 0}#screen{width:100%;max-width:640px;image-rendering:pixelated;background:#243f39;border:4px solid #9da4b4;display:block;touch-action:none}button{background:#273b5a;color:white;border:1px solid #aab9d2;border-radius:7px;padding:10px;margin:3px;font-weight:600}button:disabled{opacity:.4}.panel{background:#1d293d;border:2px solid #697b9b;padding:10px;margin:8px 0;border-radius:6px}#controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,42px)}.pad button{margin:1px;padding:3px}#log{min-height:42px}small{color:#c4d0dc}#battle{display:none}#battlefield{display:flex;justify-content:space-between;gap:12px;min-height:120px}#battlefield>div{flex:1} .unit{padding:6px;border:1px solid #60718c;margin:4px 0;background:#263a52;border-radius:4px}.front{border-left:5px solid #e4b96c}.back{border-left:5px solid #79c6ce}#actions button{font-size:13px}#mapWrap{position:relative}#tip{margin-top:4px}</style></head><body><main><h1>⚔️ Project Crystal <small>— første prototype</small></h1><div id="explore"><div id="mapWrap"><canvas id="screen" width="640" height="416"></canvas></div><div id="tip">WASD / piletaster eller knapper. Gå hen til en figur eller kiste og tryk <b>Interagér</b>.</div><div id="controls"><div class="pad"><span></span><button onclick="move(0,-1)">▲</button><span></span><button onclick="move(-1,0)">◀</button><button onclick="interact()">●</button><button onclick="move(1,0)">▶</button><span></span><button onclick="move(0,1)">▼</button><span></span></div><div><button onclick="interact()">Interagér</button><button onclick="openMenu()">Hold / Udstyr</button><button onclick="save()">Gem</button><button onclick="resetGame()">Nyt spil</button></div></div></div><div id="battle" class="panel"><h2>⚔️ Kamp</h2><div id="battlefield"><div id="allies"></div><div id="enemies"></div></div><div id="actions"></div></div><div id="menu" class="panel" style="display:none"></div><div id="log" class="panel">Velkommen! Find kister, rekruttér følgesvende, og gå ud i skoven mod øst.</div><small>Spillet gemmes lokalt i browseren. Version 0.1 · Ingen eksterne filer nødvendige.</small></main><script>
const W=20,H=13,T=32,canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
const types={warrior:{hp:100,mp:15,atk:12,def:7,mag:2,spd:5},archer:{hp:70,mp:20,atk:10,def:4,mag:2,spd:9},mage:{hp:55,mp:30,atk:5,def:3,mag:12,spd:7}};
const items={sword:{name:'Rusty Sword',slot:'weapon',stat:'atk',val:2,match:'warrior'},ironSword:{name:'Iron Sword',slot:'weapon',stat:'atk',val:5,match:'warrior'},bow:{name:'Wooden Bow',slot:'weapon',stat:'atk',val:3,match:'archer'},staff:{name:'Oak Staff',slot:'weapon',stat:'mag',val:3,match:'mage'},leather:{name:'Leather Armor',slot:'armor',stat:'def',val:2,match:'archer'},iron:{name:'Iron Armor',slot:'armor',stat:'def',val:5,match:'warrior'},robe:{name:'Apprentice Robe',slot:'armor',stat:'def',val:2,match:'mage'},potion:{name:'Potion (+35 HP)'}};
const makeChar=(type,name)=>({type,name,lv:1,xp:0,hp:types[type].hp,mp:types[type].mp,weapon:type==='warrior'?'sword':type==='archer'?'bow':'staff',armor:null});
const initial=()=>({x:3,y:6,team:[makeChar('warrior','Kriger')],bag:['potion'],opened:[],recruited:[],boss:false,wins:0});
let state;try{state=JSON.parse(localStorage.getItem('crystal_save'))||initial()}catch(e){state=initial()}
let fight=null,turn=0,busy=false;
const walls=new Set();for(let x=0;x<W;x++){walls.add(`${x},0`);walls.add(`${x},${H-1}`)}for(let y=0;y<H;y++){walls.add(`0,${y}`);walls.add(`${W-1},${y}`)}
for(let x=2;x<=6;x++)for(let y=2;y<=4;y++)walls.add(`${x},${y}`);
for(let x=10;x<=12;x++)for(let y=2;y<=4;y++)walls.add(`${x},${y}`);
const chest=[{x:7,y:7,id:'chest1',item:'ironSword'},{x:15,y:3,id:'chest2',item:'robe'},{x:16,y:10,id:'chest3',item:'iron'}];
const npcs=[{x:8,y:5,id:'archer',name:'Bueskytte'},{x:9,y:9,id:'mage',name:'Magiker'}];
const log=s=>document.getElementById('log').textContent=s;
function save(){localStorage.setItem('crystal_save',JSON.stringify(state));log('Spillet er gemt på denne enhed.')}
function resetGame(){if(confirm('Vil du begynde forfra?')){state=initial();fight=null;document.getElementById('battle').style.display='none';document.getElementById('explore').style.display='block';document.getElementById('menu').style.display='none';save();draw()}}
function draw(){ctx.clearRect(0,0,640,416);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let forest=x>=13;ctx.fillStyle=forest?((x+y)%2?'#426f48':'#487c4d'):((x+y)%2?'#6b9a69':'#72a371');ctx.fillRect(x*T,y*T,T,T);if(forest){ctx.fillStyle='#315c39';ctx.fillRect(x*T+4,y*T+4,5,5)}if(walls.has(`${x},${y}`)){ctx.fillStyle=y===2?'#a64e40':'#695446';ctx.fillRect(x*T+2,y*T+2,28,28);ctx.fillStyle='#e7b968';ctx.fillRect(x*T+8,y*T+10,16,9)}}ctx.fillStyle='#d4b784';ctx.fillRect(0,6*T,13*T,24);ctx.fillStyle='#6e5d40';ctx.fillRect(12*T,0,8,13*T);for(let c of chest)if(!state.opened.includes(c.id)){ctx.fillStyle='#d7a83d';ctx.fillRect(c.x*T+6,c.y*T+10,20,15);ctx.fillStyle='#65401e';ctx.fillRect(c.x*T+6,c.y*T+8,20,5)}for(let n of npcs)if(!state.recruited.includes(n.id)){ctx.fillStyle=n.id==='mage'?'#ad78d8':'#e7b86e';ctx.fillRect(n.x*T+9,n.y*T+6,14,21);ctx.fillStyle='#f1d6b5';ctx.fillRect(n.x*T+11,n.y*T+2,10,10)}ctx.fillStyle='#327dd1';ctx.fillRect(state.x*T+8,state.y*T+12,16,17);ctx.fillStyle='#f3d4b1';ctx.fillRect(state.x*T+10,state.y*T+4,12,11);ctx.fillStyle='#704633';ctx.fillRect(state.x*T+9,state.y*T+2,14,5);if(!state.boss){ctx.fillStyle='#c64b4b';ctx.fillRect(17*T+7,6*T+6,20,22);ctx.fillStyle='white';ctx.fillRect(17*T+10,6*T+11,4,4);ctx.fillRect(17*T+21,6*T+11,4,4)}}
function move(dx,dy){if(fight)return;let x=state.x+dx,y=state.y+dy;if(x<1||x>=W-1||y<1||y>=H-1||walls.has(`${x},${y}`))return;state.x=x;state.y=y;draw();if(x===17&&y===6&&!state.boss){startFight(true);return}if(x>=13&&Math.random()<.17)startFight(false)}
function interact(){if(fight)return;let near=(o)=>Math.abs(o.x-state.x)+Math.abs(o.y-state.y)<=1;let n=npcs.find(o=>near(o)&&!state.recruited.includes(o.id));if(n){if(state.team.length>=3){log('Dit hold er fuldt.');return}state.team.push(makeChar(n.id,n.name));state.recruited.push(n.id);log(`${n.name} slutter sig til dit hold!`);draw();saveQuiet();return}let c=chest.find(o=>near(o)&&!state.opened.includes(o.id));if(c){state.opened.push(c.id);state.bag.push(c.item);log(`Du fandt: ${items[c.item].name}! Åbn Hold / Udstyr for at bruge det.`);draw();saveQuiet();return}if(state.x<12&&state.y<=6){state.team.forEach(p=>{p.hp=maxHp(p);p.mp=maxMp(p)});log('Du hviler i landsbyen. HP og MP er gendannet.');saveQuiet();return}log('Intet at interagere med her.')}
function maxHp(p){return types[p.type].hp+(p.lv-1)*12}function maxMp(p){return types[p.type].mp+(p.lv-1)*4}
function stat(p,k){let v=types[p.type][k]+(p.lv-1)*(k==='hp'?12:k==='mp'?4:k==='spd'?1:2);for(let slot of ['weapon','armor']){let it=items[p[slot]];if(it&&it.stat===k)v+=it.val+(it.match===p.type?2:0)}return v}
function openMenu(){if(fight)return;let el=document.getElementById('menu');if(el.style.display!=='none'){el.style.display='none';return}el.style.display='block';let s='<h2>Hold og udstyr</h2>';state.team.forEach((p,i)=>{s+=`<div class="unit"><b>${p.name} Lv.${p.lv}</b> · XP ${p.xp}/${p.lv*25} · HP ${p.hp}/${maxHp(p)} · MP ${p.mp}/${maxMp(p)}<br>ATK ${stat(p,'atk')} · DEF ${stat(p,'def')} · MAG ${stat(p,'mag')}<br>Våben: ${items[p.weapon]?.name||'Intet'} · Rustning: ${items[p.armor]?.name||'Intet'}<br>`;state.bag.forEach((id,j)=>{if(items[id].slot)s+=`<button onclick="equip(${i},${j})">Udstyr: ${items[id].name}${items[id].match===p.type?' ⭐ +2':''}</button>`});s+='</div>'});s+=`<p>Taske: ${state.bag.map(id=>items[id].name).join(', ')||'Tom'}</p><button onclick="document.getElementById('menu').style.display='none'">Luk</button>`;el.innerHTML=s}
function equip(i,j){let p=state.team[i],id=state.bag[j],slot=items[id].slot;if(!slot)return;state.bag.splice(j,1);if(p[slot])state.bag.push(p[slot]);p[slot]=id;saveQuiet();openMenu();openMenu()}
function saveQuiet(){localStorage.setItem('crystal_save',JSON.stringify(state))}
function startFight(boss){document.getElementById('menu').style.display='none';let pool=boss?['boss','goblin','wolf']:['goblin','wolf','slime'];let count=boss?3:1+Math.floor(Math.random()*3);fight={boss,enemies:Array.from({length:count},(_,i)=>{let type=pool[boss?i:Math.floor(Math.random()*3)],base={boss:[95,13,5],goblin:[30,8,2],wolf:[36,9,2],slime:[24,6,1]}[type];return {type,name:{boss:'Hulevogter',goblin:'Goblin',wolf:'Ulv',slime:'Slim'}[type],hp:base[0],atk:base[1],def:base[2],stun:0}})};turn=0;document.getElementById('explore').style.display='none';document.getElementById('battle').style.display='block';log(boss?'Bosskamp! Besejr hulevogteren!':'Vilde fjender angriber!');renderBattle()}
function aliveTeam(){return state.team.filter(p=>p.hp>0)}function aliveEnemies(){return fight.enemies.filter(e=>e.hp>0)}
function renderBattle(){if(!fight)return;document.getElementById('allies').innerHTML='<b>Dit hold</b>'+state.team.map((p,i)=>`<div class="unit ${i===0?'front':'back'}">${i===0?'🛡️':'↳'} ${p.name} Lv.${p.lv}<br>❤️ ${p.hp}/${maxHp(p)} · ✨ ${p.mp}/${maxMp(p)}</div>`).join('');document.getElementById('enemies').innerHTML='<b>Fjender</b>'+fight.enemies.map((e,i)=>`<div class="unit">${e.hp>0?'👹':'☠️'} ${e.name} ${i+1}<br>❤️ ${Math.max(0,e.hp)}</div>`).join('');let p=state.team[turn];while(p&&p.hp<=0){turn++;p=state.team[turn]}if(!p){enemyPhase();return}let skills={warrior:[['Shield Bash',4],['Taunt',3]],archer:[['Double Shot',5],['Piercing Arrow',4]],mage:[['Fireball',5],['Heal',6]]}[p.type];document.getElementById('actions').innerHTML=`<b>${p.name}s tur</b><br><button onclick="choose('attack',0)">Standard Attack</button>`+skills.map((s,i)=>`<button ${p.mp<s[1]?'disabled':''} onclick="choose('skill',${i})">${s[0]} (${s[1]} MP)</button>`).join('')+`<button onclick="choose('defend',0)">Defend</button><button onclick="choose('item',0)">Potion</button><div id="targets"></div>`}
function choose(kind,idx){let p=state.team[turn];if(kind==='defend'){p.guard=true;log(`${p.name} forsvarer sig.`);next();return}if(kind==='item'){let j=state.bag.indexOf('potion');if(j<0){log('Ingen potions tilbage.');return}targetButtons(state.team.map((x,i)=>({x,i})).filter(o=>o.x.hp>0&&o.x.hp<maxHp(o.x)),o=>{state.bag.splice(j,1);o.x.hp=Math.min(maxHp(o.x),o.x.hp+35);log(`${o.x.name} får 35 HP.`);next()});return}if(kind==='skill'){let costs={warrior:[4,3],archer:[5,4],mage:[5,6]};if(p.mp<costs[p.type][idx])return;if(p.type==='warrior'&&idx===1){p.mp-=3;p.taunt=2;log('Krigeren bruger Taunt! Fjenderne fokuserer på ham.');next();return}}let healing=kind==='skill'&&p.type==='mage'&&idx===1;let choices=healing?state.team.map((x,i)=>({x,i})).filter(o=>o.x.hp>0):fight.enemies.map((x,i)=>({x,i})).filter(o=>o.x.hp>0);targetButtons(choices,o=>{if(kind==='skill')p.mp-={warrior:[4,3],archer:[5,4],mage:[5,6]}[p.type][idx];if(healing){let n=20+stat(p,'mag')*2;o.x.hp=Math.min(maxHp(o.x),o.x.hp+n);log(`${p.name} healer ${o.x.name} for ${n} HP.`)}else{let e=o.x;let dmg=Math.max(1,stat(p,kind==='skill'&&p.type==='mage'?'mag':'atk')-(kind==='skill'&&p.type==='archer'&&idx===1?Math.floor(e.def/2):e.def)+Math.floor(Math.random()*5));if(kind==='skill'&&p.type==='archer'&&idx===0)dmg*=2;if(kind==='skill'&&p.type==='mage')dmg+=9;if(kind==='skill'&&p.type==='warrior'){dmg+=4;if(Math.random()<.3)e.stun=1}e.hp=Math.max(0,e.hp-dmg);log(`${p.name} rammer ${e.name} for ${dmg} skade!`)}if(!aliveEnemies().length){win();return}next()})}
function targetButtons(arr,fn){let el=document.getElementById('targets');el.innerHTML='<p>Vælg mål:</p>';arr.forEach(o=>{let b=document.createElement('button');b.textContent=o.x.name+' '+(o.i+1);b.onclick=()=>fn(o);el.appendChild(b)})}
function next(){turn++;if(turn>=state.team.length)enemyPhase();else renderBattle()}
function enemyPhase(){let lines=[];for(let e of aliveEnemies()){if(e.stun){e.stun=0;lines.push(`${e.name} er lammet.`);continue}let alive=aliveTeam();if(!alive.length)break;let front=state.team[0];let target=front.hp>0&&(front.taunt>0||Math.random()<.7)?front:alive[Math.floor(Math.random()*alive.length)];let dmg=Math.max(1,e.atk-stat(target,'def')+Math.floor(Math.random()*5));if(target.guard)dmg=Math.ceil(dmg/2);target.hp=Math.max(0,target.hp-dmg);lines.push(`${e.name} rammer ${target.name} for ${dmg}.`)}state.team.forEach(p=>{p.guard=false;if(p.taunt>0)p.taunt--});if(!aliveTeam().length){state.team.forEach(p=>{p.hp=Math.max(1,Math.floor(maxHp(p)/2));p.mp=Math.floor(maxMp(p)/2)});endFight();log('Dit hold blev besejret og vågner i landsbyen.');state.x=3;state.y=6;saveQuiet();draw();return}turn=0;renderBattle();log(lines.join(' '))}
function win(){let xp=fight.boss?55:15+fight.enemies.length*7;let boss=fight.boss;state.team.forEach(p=>{p.xp+=xp;while(p.xp>=p.lv*25){p.xp-=p.lv*25;p.lv++;p.hp=maxHp(p);p.mp=maxMp(p)}});state.wins++;if(boss)state.boss=true;else if(Math.random()<.35)state.bag.push('potion');endFight();log(`Sejr! Alle får ${xp} XP.${boss?' Du besejrede hulevogteren! Første mission gennemført!':''}`);saveQuiet();draw()}
function endFight(){fight=null;document.getElementById('battle').style.display='none';document.getElementById('explore').style.display='block'}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(fight)return;let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move(0,-1);if(k==='arrowdown'||k==='s')move(0,1);if(k==='arrowleft'||k==='a')move(-1,0);if(k==='arrowright'||k==='d')move(1,0);if(k===' '||k==='e')interact()});draw();
</script></body></html>
